<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanna forward-production fixture</title>
  <style>
    @font-face {
      font-family: "Clash Display";
      src: url("../../assets/datta/fonts/clash-display-700.woff2") format("woff2");
      font-weight: 700;
      font-display: block;
    }
    @font-face {
      font-family: "General Sans";
      src: url("../../assets/datta/fonts/general-sans-500.woff2") format("woff2");
      font-weight: 500;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #091105;
    }
    .art {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: #F1F1F1;
      background: #091105;
      text-rendering: geometricPrecision;
    }
    .label {
      position: absolute;
      left: 80px;
      top: 96px;
      font: 500 20px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
    }
    .rule {
      position: absolute;
      left: 80px;
      top: 143px;
      width: 248px;
      height: 2px;
      background: #C89C4F;
    }
    h1 {
      position: absolute;
      left: 80px;
      top: 192px;
      width: 920px;
      margin: 0;
      font: 700 96px/.98 "Clash Display", sans-serif;
      letter-spacing: -.025em;
    }
    .support {
      position: absolute;
      left: 84px;
      top: 610px;
      width: 760px;
      margin: 0;
      font: 500 36px/1.42 "General Sans", sans-serif;
      letter-spacing: -.005em;
    }
    .signal {
      position: absolute;
      left: 80px;
      top: 890px;
      width: 920px;
      height: 210px;
    }
    .signal-line {
      position: absolute;
      left: 0;
      top: 88px;
      width: 820px;
      height: 1px;
      background: rgba(241, 241, 241, .42);
    }
    .node {
      position: absolute;
      top: 80px;
      width: 17px;
      height: 17px;
      border: 2px solid #F1F1F1;
      border-radius: 50%;
      background: #091105;
    }
    .node.one { left: 0; }
    .node.two { left: 394px; }
    .node.three {
      left: 811px;
      border: 0;
      background: #C89C4F;
    }
    .node-label {
      position: absolute;
      top: 116px;
      font: 500 18px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
    }
    .node-label.one { left: 0; }
    .node-label.two { left: 394px; }
    .node-label.three { left: 710px; color: #C89C4F; }
    .fixture-note {
      position: absolute;
      right: 80px;
      bottom: 105px;
      font: 500 18px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .065em;
      color: #A8B0A8;
    }
    .mark {
      position: absolute;
      left: 80px;
      bottom: 96px;
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    @media (max-width: 600px) {
      .art {
        transform: scale(.4);
        transform-origin: 0 0;
      }
    }
  </style>
</head>
<body>
  <main class="art" aria-label="Post estático da Agência Datta sobre dados e decisões">
    <div class="label">SINAL / DECISÃO OPERACIONAL</div>
    <div class="rule"></div>
    <h1>Mais dados não<br>significam melhores<br>decisões.</h1>
    <p class="support">Sem uma pergunta, uma definição<br>e uma fonte confiável, o relatório<br>pode aumentar o ruído.</p>
    <div class="signal" aria-hidden="true">
      <div class="signal-line"></div>
      <div class="node one"></div>
      <div class="node two"></div>
      <div class="node three"></div>
      <div class="node-label one">DADO</div>
      <div class="node-label two">CONTEXTO</div>
      <div class="node-label three">DECISÃO</div>
    </div>
    <img class="mark" src="../../assets/datta/datta-simbolo-branco.png" alt="">
    <div class="fixture-note">MODELO CONCEITUAL / SEM DADOS DE CLIENTE</div>
  </main>
</body>
</html>
